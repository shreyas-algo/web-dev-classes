<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row input {
            width: 50%;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: darkblue;
        }
        .error {
            color: red;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <div class="row">
                <input type="text" id="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" placeholder="Last Name" required>
            </div>
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="date" id="dob" required>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <p class="error" id="errorMessage"></p>
            <button type="submit">Sign Up</button>
        </form>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let firstName = document.getElementById("firstName").value;
            let lastName = document.getElementById("lastName").value;
            let username = document.getElementById("username").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let dob = document.getElementById("dob").value;
            let gender = document.getElementById("gender").value;
            let errorMessage = document.getElementById("errorMessage");

            if (firstName.length < 2) {
                errorMessage.textContent = "First name must be at least 2 characters long.";
                return;
            }
            if (lastName.length < 2) {
                errorMessage.textContent = "Last name must be at least 2 characters long.";
                return;
            }
            if (username.length < 3) {
                errorMessage.textContent = "Username must be at least 3 characters long.";
                return;
            }
            if (!email.includes("@")) {
                errorMessage.textContent = "Enter a valid email address.";
                return;
            }
            if (password.length < 6) {
                errorMessage.textContent = "Password must be at least 6 characters long.";
                return;
            }
            if (dob === "") {
                errorMessage.textContent = "Please enter your date of birth.";
                return;
            }
            if (gender === "") {
                errorMessage.textContent = "Please select a gender.";
                return;
            }
            
            alert("Sign Up Successful!");
            errorMessage.textContent = "";
        });
    </script>
</body>
</html>
