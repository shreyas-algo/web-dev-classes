<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .gender label {
            margin-right: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #145dbf;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        <p>It's quick and easy.</p>
        <form id="signupForm">
            <input type="text" id="firstName" placeholder="First name" required>
            <input type="text" id="lastName" placeholder="Last name" required>
            <input type="text" id="emailOrPhone" placeholder="Mobile number or email" required>
            <input type="password" id="password" placeholder="New password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            <label>Birthday</label>
            <select id="birthMonth">
                <option value="">Month</option>
                <script>for(let i=1; i<=12; i++) document.write(`<option value="${i}">${i}</option>`);</script>
            </select>
            <select id="birthDay">
                <option value="">Day</option>
                <script>for(let i=1; i<=31; i++) document.write(`<option value="${i}">${i}</option>`);</script>
            </select>
            <select id="birthYear">
                <option value="">Year</option>
                <script>for(let i=2024; i>=1920; i--) document.write(`<option value="${i}">${i}</option>`);</script>
            </select>
            <div class="gender">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Custom"> Custom</label>
            </div>
            <button type="submit">Sign Up</button>
        </form>
    </div>
    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const firstName = document.getElementById("firstName").value;
            const lastName = document.getElementById("lastName").value;
            const emailOrPhone = document.getElementById("emailOrPhone").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            // Validate first name and last name
            const namePattern = /^[A-Za-z]+$/;
            if (!namePattern.test(firstName)) {
                alert("First name should contain only alphabets!");
                return;
            }
            if (!namePattern.test(lastName)) {
                alert("Last name should contain only alphabets!");
                return;
            }

            // Validate email or phone number
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phonePattern = /^\d{10}$/; // Assuming a 10-digit phone number
            if (!emailPattern.test(emailOrPhone) && !phonePattern.test(emailOrPhone)) {
                alert("Please enter a valid email address or phone number!");
                return;
            }

            // Validate passwords
            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            const userData = {
                firstName: firstName,
                lastName: lastName,
                emailOrPhone: emailOrPhone,
                password: password,
                birthMonth: document.getElementById("birthMonth").value,
                birthDay: document.getElementById("birthDay").value,
                birthYear: document.getElementById("birthYear").value,
                gender: document.querySelector('input[name="gender"]:checked')?.value || ""
            };

            // Store user data in local storage
            localStorage.setItem('userData', JSON.stringify(userData));

            console.log("User Registered:", userData);
            alert("Registration successful!");

            // Reset the form fields
            document.getElementById("signupForm").reset();
        });
    </script>
</body>
</html>
